# Lock (pip constraints) for linux/requirements-linux.txt: every package the
# Linux kit installs, at the versions of the Windows environment that produced
# the published case-study results. Without it, pip picks the newest transitive
# packages on the day of install (python-dateutil, pystac and others have moved
# since the published runs).
#
# Use: pip install -r linux/requirements-linux.txt -c linux/requirements-linux.lock
# (linux/setup.sh and linux/Dockerfile already do this.)
#
# Generated on 2026-11-27 without installing anything, from the repository root:
#   pip freeze > venv-freeze.txt          # in the project .venv (Python 3.12.5)
#   pip install --dry-run --ignore-installed --report report.json #     --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 #     --platform manylinux_2_17_x86_64 --python-version 3.12 --implementation cp #     --only-binary=:all: --target /tmp/never #     -r linux/requirements-linux.txt -c venv-freeze.txt
# then one name==version line per entry of report.json "install". Two runs gave
# identical output. Every entry resolved to a Linux x86_64 wheel for CPython
# 3.12 (also checked for 3.13). colorama is listed because pip evaluates
# platform markers on the machine that resolves (Windows); as a constraint it is
# harmless on Linux, where nothing asks for it.
