name: Temporary real Sentinel-2 pixel COG probe
on:
  push:
    paths: ['.github/workflows/temporary-public-pixel-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install minimal observation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.2 planetary-computer==1.0.0 pystac-client==0.8.6 rasterio==1.5.0
      - name: Inspect STAC asset keys before pixel retrieval
        run: |
          python - <<'PY'
          from pystac_client import Client
          from planetary_computer import sign_inplace
          url="https://planetarycomputer.microsoft.com/api/stac/v1"
          catalog=Client.open(url,modifier=sign_inplace)
          items=list(catalog.search(collections=["sentinel-2-l2a"],bbox=[-68.25,-23.48,-68.238,-23.468],datetime="2024-10-01/2024-10-15",query={"eo:cloud_cover":{"lt":60}},max_items=8).items())
          print("item_count",len(items))
          for item in items[:5]:
              print("item",item.id,"cloud",item.properties.get("eo:cloud_cover"),"assets",sorted(item.assets.keys()))
          PY
      - name: Read public real Sentinel-2 COG preview
        env:
          AWS_NO_SIGN_REQUEST: "YES"
          GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
        run: |
          python -m pipeline.planetary_observation \
            --bbox -68.250 -23.480 -68.238 -23.468 \
            --start 2024-10-01 --end 2024-10-15 \
            --output-dir research_private/observations
          python - <<'PY'
          import json, pathlib, numpy as np
          root=pathlib.Path("research_private/observations")
          manifests=list(root.glob("planetary_observed_*.json"))
          assert len(manifests)==1
          record=json.loads(manifests[0].read_text())
          pixels=next(root.glob("planetary_observed_*.npz"))
          with np.load(pixels) as content:
            useful=int(np.isfinite(content["ndvi"]).sum())
            print(json.dumps({"source_item":record["scene_id"],"acquired":record["acquired"],"bands":record["asset_keys"],"pixel_grid":record["grid_shape"],"useful_pixels":useful,"checksum_sha256":record["checksum_sha256"],"scientific_validation":record["scientific_validation"]}))
            assert useful>=20
          PY

# Retest after aligning Planetary Computer asset key nomenclature (B02 vs B2).

      - name: Read Peru public Sentinel-2 COG preview
        run: |
          python -m pipeline.planetary_observation \
            --bbox -70.10 -12.70 -70.09 -12.69 \
            --start 2025-03-01 --end 2025-03-31 \
            --output-dir research_private/peru
          python - <<'PY'
          import json, pathlib, numpy as np
          root=pathlib.Path("research_private/peru")
          record=json.loads(next(root.glob("planetary_observed_*.json")).read_text())
          with np.load(next(root.glob("planetary_observed_*.npz"))) as d:
              valid=int(np.isfinite(d["ndvi"]).sum())
          print(json.dumps({"study":"Peru","id":record["scene_id"],"acquired":record["acquired"],"valid_pixels":valid,"sha256":record["checksum_sha256"],"scientific_validation":record["scientific_validation"]}))
          PY
      - name: Read Czechia public Sentinel-2 COG preview
        run: |
          python -m pipeline.planetary_observation \
            --bbox 14.90 50.40 14.91 50.41 \
            --start 2025-07-01 --end 2025-07-31 \
            --output-dir research_private/czechia
          python - <<'PY'
          import json, pathlib, numpy as np
          root=pathlib.Path("research_private/czechia")
          record=json.loads(next(root.glob("planetary_observed_*.json")).read_text())
          with np.load(next(root.glob("planetary_observed_*.npz"))) as d:
              valid=int(np.isfinite(d["ndvi"]).sum())
          print(json.dumps({"study":"Czechia","id":record["scene_id"],"acquired":record["acquired"],"valid_pixels":valid,"sha256":record["checksum_sha256"],"scientific_validation":record["scientific_validation"]}))
          PY

# Rerun all 3 scenes; rely on pixel SCL mask instead of global cloud gate.
