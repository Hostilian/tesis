name: Temporary public STAC discovery (no secrets)
on:
  push:
    paths: ['.github/workflows/temporary-public-stac-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Public STAC item discovery, metadata only
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          studies = [
            ("CHL_ATACAMA", [-68.250,-23.480,-68.238,-23.468], "2024-10-01T00:00:00Z/2024-10-15T23:59:59Z"),
            ("PER_MADRE_DE_DIOS",[-70.1,-12.7,-70.09,-12.69],"2025-03-01T00:00:00Z/2025-03-31T23:59:59Z"),
            ("CZE_BOHEMIA",[14.9,50.4,14.91,50.41],"2025-07-01T00:00:00Z/2025-07-31T23:59:59Z"),
          ]
          base="https://stac.dataspace.copernicus.eu/v1/collections/sentinel-2-l2a/items"
          for label,bbox,when in studies:
            params=urllib.parse.urlencode({"bbox":",".join(map(str,bbox)),"datetime":when,"limit":"3"})
            url=base+"?"+params
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"SBEI-public-evidence-probe/1.0","Accept":"application/geo+json"}),timeout=30) as response:
                result=json.load(response)
                items=result.get("features",[])
                print(json.dumps({"study":label,"http":response.status,"query":url,"count_returned":len(items),"examples":[{"id":it.get("id"),"datetime":it.get("properties",{}).get("datetime"),"collection":it.get("collection"),"assets":sorted(it.get("assets",{}).keys())[:8]} for it in items]},ensure_ascii=False))
            except Exception as exc:
              print(json.dumps({"study":label,"error":str(exc)}))
          PY
