name: Linux run kit

# Proves the project runs on a clean Linux machine exactly as the teacher's
# machine would run it (linux/check_machine.sh -> setup.sh -> run_all.sh).
# Default: tests + synthetic soil check. Manual "full" also re-downloads the
# Sentinel-2 scenes and re-runs both case studies (about 10-15 minutes).

on:
  push:
    paths:
      - "linux/**"
      - "pipeline/src/case_study.py"
      - "pipeline/src/soil_link.py"
      - "pipeline/run_soil_link.py"
      - "pipeline/tests/test_soil_link.py"
      - ".github/workflows/linux-run-kit.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "Also re-run both case studies from live satellite data"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.5"
      - name: Check machine
        run: bash linux/check_machine.sh
      - name: Set up environment
        run: bash linux/setup.sh
      - name: Run (tests + soil check)
        if: ${{ !inputs.full }}
        run: /usr/bin/time -v bash linux/run_all.sh 2> time.txt; s=$?; grep -E "Maximum resident|Elapsed" time.txt; exit $s
      - name: Run full chain (live satellite data)
        if: ${{ inputs.full }}
        run: /usr/bin/time -v bash linux/run_all.sh --full 2> time.txt; s=$?; grep -E "Maximum resident|Elapsed" time.txt; du -sh .venv-linux out; exit $s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-run
          path: |
            out/
            time.txt
