name: Satellite Pipeline Rehearsal (Unpublished)

# The current model still uses synthetic feature arrays. A successful run
# is NOT evidence of real satellite-scene processing or ground truth.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Reproduce demo without publishing it as new observations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          pip install -r pipeline/requirements-dev.txt

      - name: Reproduce synthetic demonstration
        env:
          MOCK_MODE: 'true'
          GITHUB_ACTIONS: 'true'
        run: python pipeline/run_pipeline.py

      - name: Validate evidence and API consistency
        run: python -m pytest pipeline/tests/test_evidence_integrity.py -q

      - name: Upload review-only demonstration artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-pipeline-review-${{ github.run_id }}
          path: |
            docs/data/anomalies.json
            docs/data/anomalies.provenance.json
            docs/data/regions.geojson
            docs/data/pipeline_runs/run_*.json
            docs/api/v1/
          if-no-files-found: warn
          retention-days: 14

      # No automatic git push. Real results require scene-level raster
      # provenance, independent validation, and an explicit reviewed release.
