name: Temporary pinned Black health formatter
on:
  push:
    paths: ['.github/workflows/temporary-black-health.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply project-pinned Black formatter
        run: |
          python -m pip install black==24.10.0
          black pipeline/src/health_check.py
          black --check pipeline/src/ pipeline/run_pipeline.py
      - name: Publish formatting result to review branch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c fix/health-black-20261119
          git add pipeline/src/health_check.py
          git diff --cached --quiet && { echo 'Expected Black update missing'; exit 1; }
          git commit -m "style(health): apply pinned Black formatter"
          git push origin HEAD
