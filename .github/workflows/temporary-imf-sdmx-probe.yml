name: Temporary IMF SDMX compatibility probe
on:
  push:
    paths: ['.github/workflows/temporary-imf-sdmx-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Probe documented public IMF SDMX versions (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO,9.0.0/CZE.NGDP_RPCH?startPeriod=2023&endPeriod=2024'
            'https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/WEO/+/CZE.NGDP_RPCH.A?startPeriod=2023&endPeriod=2024&format=jsondata'
            'https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/WEO/+/CZE.NGDP_RPCH.A?startPeriod=2023&endPeriod=2024&format=csvfile'
          )
          for url in "${urls[@]}"; do
            echo "::group::Testing ${url%%\?*}"
            code=$(curl --silent --show-error --location --max-time 15 --header 'Accept: application/json' --output /tmp/imf_response --write-out '%{http_code}' "$url") || true
            echo "HTTP: ${code:-transport failure}"
            echo "Response bytes: $(wc -c </tmp/imf_response 2>/dev/null || echo 0)"
            head -c 500 /tmp/imf_response 2>/dev/null || true
            echo
            echo "::endgroup::"
          done
