name: Temporary pinned Black endpoint repair
on:
  push:
    paths:
      - '.github/workflows/temporary-format-evidence-endpoints.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply pinned Black
        run: |
          python -m pip install black==24.10.0
          black pipeline/src/health_check.py pipeline/src/ingestion.py
          black --check pipeline/src/ pipeline/run_pipeline.py
      - name: Publish generated patch on review branch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c fix/evidence-endpoints-black-20261119
          git add pipeline/src/health_check.py pipeline/src/ingestion.py
          if git diff --cached --quiet; then
            echo 'No formatting changes generated'
            exit 1
          fi
          git commit -m "style(integrations): apply pinned Black to IMF and STAC fixes"
          git push origin HEAD
