name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 2 * * 1' # Weekly Mondays at 2:00 AM UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── Python Dependency Audit ──────────────────────────────────────────────────
  python-dependency-audit:
    name: Python pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag 2026-11-04

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 tag 2026-11-04
        with:
          python-version: '3.12'

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # Keep the actual vulnerability exit status; always publish the JSON report.
          pip-audit -r pipeline/requirements.txt -f json -o pip-audit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4 tag 2026-11-04
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  # ── Python Bandit Scan ───────────────────────────────────────────────────────
  bandit-scan:
    name: Bandit Python Security Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag 2026-11-04

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 tag 2026-11-04
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run Bandit
        run: bandit -r pipeline/src/ -c pyproject.toml --exit-zero --format json -o bandit-report.json

      - name: Upload Bandit Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4 tag 2026-11-04
        with:
          name: bandit-security-report
          path: bandit-report.json

  # ── JavaScript Dependency Audit ──────────────────────────────────────────────
  js-dependency-audit:
    name: npm audit (docs/ JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag 2026-11-04

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4 tag 2026-11-04
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Run npm audit
        run: |
          cd docs
          npm audit --audit-level=high

  # ── CodeQL Static Analysis ───────────────────────────────────────────────────
  codeql-analysis:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag 2026-11-04

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # verified v3 tag 2026-11-04
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # verified v3 tag 2026-11-04

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # verified v3 tag 2026-11-04
        with:
          category: "/language:python"

  # ── Secrets Detection ────────────────────────────────────────────────────────
  secrets-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag 2026-11-04
        with:
          fetch-depth: 0  # Full history for full scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # verified v2 tag 2026-11-04
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional for enterprise

  # ── SBOM Generation ─────────────────────────────────────────────────────────
  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag 2026-11-04

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft dir:pipeline/src --output cyclonedx-json > sbom.json
          echo "SBOM generated successfully"
          cat sbom.json | head -50

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4 tag 2026-11-04
        with:
          name: software-bill-of-materials
          path: sbom.json
          retention-days: 90

  # ── DAST & API Fuzzing Scan ──────────────────────────────────────────────────
  dast-fuzz-scan:
    name: DAST API Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag 2026-11-04

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 tag 2026-11-04
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          pip install -r pipeline/requirements-dev.txt

      - name: Run DAST Fuzzer
        run: python pipeline/tests/fuzz_api.py

  dast-dashboard:
    name: OWASP ZAP Baseline DAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag 2026-11-04

      - name: Start static dashboard server
        run: |
          python -m http.server 8080 --directory docs &
          sleep 5

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # verified v0.14.0 tag 2026-11-04
        with:
          target: 'http://127.0.0.1:8080/'
          fail_action: false
          allow_issue_writing: false

  api-fuzzing:
    name: OpenAPI Fuzzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag 2026-11-04

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 tag 2026-11-04
        with:
          python-version: '3.12'

      - name: Start static API server
        run: |
          python -m http.server 8081 --directory docs &
          sleep 5

      - name: Run Schemathesis fuzzing
        run: |
          python -m pip install --upgrade pip
          pip install schemathesis
          schemathesis run docs/openapi.yaml --url http://127.0.0.1:8081 --checks all --max-examples 25
