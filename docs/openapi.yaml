openapi: 3.0.3
info:
  title: Space-Based Economic Intelligence REST API
  description: Static research demonstrator API. Published anomaly events currently use synthetic pixels and unverified scenarios; real raster previews are separate from these records.
  version: 1.0.0
servers:
  - url: ./api/v1
    description: Relative API server path
paths:
  /anomalies:
    get:
      summary: Retrieve all anomalies
      description: Returns synthetic demonstration anomaly records with explicit evidence provenance, not verified satellite detections.
      responses:
        '200':
          description: A successful response with the list of anomalies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Anomaly'
  /anomalies/{id}:
    get:
      summary: Retrieve a single anomaly detail
      description: Returns a scenario record, including demo status and limitations, not an independently verified environmental event.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the anomaly (e.g., anomaly_lithium_1).
          schema:
            type: string
      responses:
        '200':
          description: Detail of the requested anomaly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anomaly'
        '404':
          description: No anomaly exists for the supplied identifier.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    type: string
  /datasets:
    get:
      summary: Retrieve datasets metadata
      description: Returns dataset/sensor descriptions. These metadata entries do not prove real raster scenes were used in the published demo anomalies.
      responses:
        '200':
          description: A list of datasets used.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dataset'
  /status:
    get:
      summary: Retrieve pipeline status
      description: Returns a static pipeline snapshot with synthetic-demo mode. Online means the JSON resource is accessible, not continuous live satellite monitoring.
      responses:
        '200':
          description: Current pipeline execution status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
components:
  schemas:
    Anomaly:
      type: object
      required: [id, type, region, confidence, data_origin, verification_status, verification]
      description: An anomaly-shaped research demonstration record; confidence is an illustrative score, not a calibrated probability.
      properties:
        id:
          type: string
        data_origin:
          type: string
          enum: [synthetic_demo, observed_unvalidated, validated_observation]
        verification_status:
          type: string
          enum: [unverified, in_review, validated]
        evidence_notice:
          type: string
        confidence_interpretation:
          type: string
        type:
          type: string
        region:
          type: string
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: A normalized model/demo score, not a calibrated event probability.
        uncertainty:
          type: number
        confidence_interval:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        date:
          type: string
        spectral_profile:
          type: object
          properties:
            ndvi:
              type: number
            ndwi:
              type: number
            bsi:
              type: number
        details:
          type: string
        verification:
          type: object
          required: [status, validation_state]
          properties:
            validation_state:
              type: string
              description: Validation workflow state; current records are not independently validated.
            evidence_note:
              type: string
            ground_truth_note:
              type: string
            method:
              type: string
            ground_truth:
              type: string
            status:
              type: string
    Dataset:
      type: object
      properties:
        name:
          type: string
        resolution:
          type: string
        revisit:
          type: string
        description:
          type: string
    Status:
      type: object
      required: [status, data_mode, anomalies_count, verified_satellite_observations]
      properties:
        data_mode:
          type: string
          enum: [synthetic_demo, observed_unvalidated, validated_observation]
        verified_satellite_observations:
          type: integer
          minimum: 0
        status_note:
          type: string
        publication_policy:
          type: string
        status:
          type: string
        last_pipeline_run:
          type: string
        anomalies_count:
          type: integer
        environment:
          type: string
